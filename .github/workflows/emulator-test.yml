name: Emulator smoke test

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write   # lets the job publish the tested APK as a public release

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/PyPy" || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          curl -sL -o prev.apk "https://github.com/${{ github.repository }}/releases/download/latest/Matchday.apk" || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash -o pipefail -c "bash ci/smoke.sh 2>&1 | tee smoke.log"

      - name: Publish test log (ci-smoke-log branch)
        if: always()
        run: |
          RESULT=${{ job.status }}
          [ -f smoke.log ] || echo "no smoke log (build or emulator start failed)" > smoke.log
          git config user.name Matchday; git config user.email matchday@users.noreply.github.com
          git stash -q 2>/dev/null || true
          git checkout -q --orphan smokelog
          git rm -rfq --cached . >/dev/null
          git add -f smoke.log
          git commit -qm "${GITHUB_SHA::7} ${RESULT}"
          git push -qf origin HEAD:ci-smoke-log
          git checkout -q -f ${GITHUB_SHA}

      # Only reached when the smoke test passed: publish a public, login-free download link.
      - name: Publish tested APK (public download link)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Matchday.apk
          # Keep the release tag on the tested commit
          git tag -f latest && git push -f origin refs/tags/latest
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "Matchday - latest tested build" \
              --notes "Download Matchday.apk below, open it on your Android phone and allow installing from this source. Passed the automated emulator test (online, offline, fresh install)."
          fi
          gh release upload latest Matchday.apk --clobber
          gh release edit latest --notes "Download Matchday.apk below, open it on your Android phone and allow installing from this source. Build ${GITHUB_SHA::7}, passed the automated emulator test (online, offline, fresh install)."
