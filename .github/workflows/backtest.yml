name: Backtest

on:
  push:
    branches: [ backtest ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run back-test
        run: |
          chmod +x gradlew
          BACKTEST=1 BACKTEST_OUT=$PWD/backtest.txt ./gradlew :app:testDebugUnitTest --tests com.matchday.app.Backtest --stacktrace 2>&1 | tail -80 > gradle_tail.txt || true
          [ -f backtest.txt ] || cp gradle_tail.txt backtest.txt
      - name: Publish result
        if: always()
        run: |
          git config user.name Matchday; git config user.email matchday@users.noreply.github.com
          cp backtest.txt /tmp/bt.txt 2>/dev/null || echo "no output" > /tmp/bt.txt
          cp gradle_tail.txt /tmp/gt.txt 2>/dev/null || true
          git checkout -q --orphan btlog
          git rm -rfq --cached . >/dev/null
          cp /tmp/bt.txt backtest.txt; cp /tmp/gt.txt gradle_tail.txt 2>/dev/null || true
          git add -f backtest.txt gradle_tail.txt 2>/dev/null || git add -f backtest.txt
          git commit -qm "${GITHUB_SHA::7}"
          git push -qf origin HEAD:ci-backtest-log
