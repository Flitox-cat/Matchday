name: Probe data sources
on:
  push:
    branches: [ probe ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e
          cat > p.py <<'PY'
          import json,sys
          def strip(o):
              if isinstance(o,dict):
                  return {k:strip(v) for k,v in o.items() if k not in ('links','link','logos','tracking','images','headshot','flag','$ref','jerseyImages','notes','broadcasts','tickets','geoBroadcasts')}
              if isinstance(o,list): return [strip(x) for x in o[:2]]
              return o
          try: d=json.load(sys.stdin)
          except Exception as e: print('NOT JSON', e); sys.exit()
          for p in (sys.argv[1].split('.') if sys.argv[1] else []):
              d=d[int(p)] if p.isdigit() and isinstance(d,list) and len(d)>int(p) else (d.get(p) if isinstance(d,dict) else None)
              if d is None: print('MISSING',p); sys.exit()
          print(json.dumps(strip(d))[:int(sys.argv[2])])
          PY
          g() { curl -s --compressed -m 30 "$1"; }
          S=https://site.api.espn.com/apis/site/v2/sports/soccer
          {
          curl -s -m 30 "https://raw.githubusercontent.com/Tennismylife/TML-Database/master/2026.csv" > /tmp/t.csv; wc -l /tmp/t.csv; head -1 /tmp/t.csv; tail -2 /tmp/t.csv
          python3 -c "
          import csv; r=list(csv.DictReader(open('/tmp/t.csv'))); print(len(r),'rows; last date',max(x.get('tourney_date','') for x in r)); print('with aces',sum(1 for x in r if x.get('w_ace')))"
          curl -s -m 20 "https://api.github.com/repos/Tennismylife/TML-Database/commits?per_page=1" | head -c 300; echo
          printf "stats site: "; curl -s -o /dev/null -w "%{http_code}\n" -m 20 https://stats.tennismylife.org/
          curl -s -m 20 https://stats.tennismylife.org/robots.txt | head -8
          printf "tennis-db robots: "; curl -s -m 20 https://tennis-db.com/robots.txt | head -10
          } > probe_out.txt 2>&1
          cat probe_out.txt
          git config user.name Matchday; git config user.email matchday@users.noreply.github.com
          git add probe_out.txt && git commit -qm "probe output" && git push -q origin HEAD:probe
