name: Probe data sources
on:
  push:
    branches: [ probe ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e
          cat > p.py <<'PY'
          import json,sys
          def strip(o):
              if isinstance(o,dict):
                  return {k:strip(v) for k,v in o.items() if k not in ('links','link','logos','tracking','images','headshot','flag','$ref','jerseyImages','notes','broadcasts','tickets','geoBroadcasts')}
              if isinstance(o,list): return [strip(x) for x in o[:2]]
              return o
          try: d=json.load(sys.stdin)
          except Exception as e: print('NOT JSON', e); sys.exit()
          for p in (sys.argv[1].split('.') if sys.argv[1] else []):
              d=d[int(p)] if p.isdigit() and isinstance(d,list) and len(d)>int(p) else (d.get(p) if isinstance(d,dict) else None)
              if d is None: print('MISSING',p); sys.exit()
          print(json.dumps(strip(d))[:int(sys.argv[2])])
          PY
          g() { curl -s --compressed -m 30 "$1"; }
          S=https://site.api.espn.com/apis/site/v2/sports/soccer
          {
          for L in basketball/nba hockey/nhl hockey/mens-college-hockey; do
            curl -s --compressed -m 25 -A "Matchday-Android/2.0" "https://site.api.espn.com/apis/site/v2/sports/$L/scoreboard?dates=20261112" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for e in d.get('events',[]):
              c=e['competitions'][0]; t={x['homeAway']:x for x in c['competitors']}
              h,a=t['home'],t['away']
              rec=lambda x: ','.join(r.get('summary','') for r in (x.get('records') or [])[:3])
              o=[x for x in (c.get('odds') or []) if x]
              od=''
              if o:
                  o=o[0]; ml=o.get('moneyline') or {}
                  def g(k,s):
                      try: return ml[k][s]['odds']
                      except: return None
                  od='ML %s/%s spread %s total %s | %s'%(g('home','close') or g('home','open'),g('away','close') or g('away','open'),o.get('spread'),o.get('overUnder'),o.get('details'))
              print('$L', e['date'], a['team']['displayName'],'('+rec(a)+') @',h['team']['displayName'],'('+rec(h)+')', c['status']['type']['shortDetail'], od)
          "
          done
          } > probe_out.txt 2>&1
          cat probe_out.txt
          git config user.name Matchday; git config user.email matchday@users.noreply.github.com
          git add probe_out.txt && git commit -qm "probe output" && git push -q origin HEAD:probe
