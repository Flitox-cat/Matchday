name: Probe data sources
on:
  push:
    branches: [ probe ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e
          cat > p.py <<'PY'
          import json,sys
          def strip(o):
              if isinstance(o,dict):
                  return {k:strip(v) for k,v in o.items() if k not in ('links','link','logos','tracking','images','headshot','flag','$ref','jerseyImages','notes','broadcasts','tickets','geoBroadcasts')}
              if isinstance(o,list): return [strip(x) for x in o[:2]]
              return o
          try: d=json.load(sys.stdin)
          except Exception as e: print('NOT JSON', e); sys.exit()
          for p in (sys.argv[1].split('.') if sys.argv[1] else []):
              d=d[int(p)] if p.isdigit() and isinstance(d,list) and len(d)>int(p) else (d.get(p) if isinstance(d,dict) else None)
              if d is None: print('MISSING',p); sys.exit()
          print(json.dumps(strip(d))[:int(sys.argv[2])])
          PY
          g() { curl -s --compressed -m 30 "$1"; }
          S=https://site.api.espn.com/apis/site/v2/sports/soccer
          {
          for T in atp wta; do
            g "https://site.api.espn.com/apis/site/v2/sports/tennis/$T/scoreboard" > sb_$T.json
            python3 - "$T" <<'PY2'
          import json, sys, subprocess
          t = sys.argv[1]
          d = json.load(open('sb_%s.json' % t))
          n = 0
          for e in d.get('events', []):
              for g in e.get('groupings', []):
                  for c in g.get('competitions', []):
                      if c.get('status', {}).get('type', {}).get('state') != 'pre': continue
                      names = [x.get('athlete', {}).get('displayName') for x in c.get('competitors', [])]
                      print(t, e['id'], c['id'], names, 'odds in scoreboard:', 'odds' in c)
                      url = 'https://sports.core.api.espn.com/v2/sports/tennis/leagues/%s/events/%s/competitions/%s/odds' % (t, e['id'], c['id'])
                      out = subprocess.run(['curl', '-s', '-m', '20', '-A', 'Matchday-Android/2.0', url], capture_output=True, text=True).stdout
                      print('  core odds:', out[:700])
                      n += 1
                      if n >= 3: break
                  if n >= 3: break
              if n >= 3: break
          PY2
          done
          echo "=== sofascore robots"; curl -s -m 15 https://www.sofascore.com/robots.txt | head -30
          echo "=== sofascore api status"; curl -s -o /dev/null -w "%{http_code}\n" -m 15 -A "Matchday-Android/2.0" "https://api.sofascore.com/api/v1/sport/tennis/scheduled-events/2026-11-09"
          echo "=== flashscore robots"; curl -s -m 15 https://www.flashscore.com/robots.txt | head -20
          } > probe_out.txt 2>&1
          cat probe_out.txt
          git config user.name Matchday; git config user.email matchday@users.noreply.github.com
          git add probe_out.txt && git commit -qm "probe output" && git push -q origin HEAD:probe
