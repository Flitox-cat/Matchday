name: Probe data sources
on:
  push:
    branches: [ probe ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e
          cat > p.py <<'PY'
          import json,sys
          def strip(o):
              if isinstance(o,dict):
                  return {k:strip(v) for k,v in o.items() if k not in ('links','link','logos','tracking','images','headshot','flag','$ref','jerseyImages','notes','broadcasts','tickets','geoBroadcasts')}
              if isinstance(o,list): return [strip(x) for x in o[:2]]
              return o
          try: d=json.load(sys.stdin)
          except Exception as e: print('NOT JSON', e); sys.exit()
          for p in (sys.argv[1].split('.') if sys.argv[1] else []):
              d=d[int(p)] if p.isdigit() and isinstance(d,list) and len(d)>int(p) else (d.get(p) if isinstance(d,dict) else None)
              if d is None: print('MISSING',p); sys.exit()
          print(json.dumps(strip(d))[:int(sys.argv[2])])
          PY
          g() { curl -s --compressed -m 30 "$1"; }
          S=https://site.api.espn.com/apis/site/v2/sports/soccer
          {
          curl -s --compressed -m 25 "https://sports.core.api.espn.com/v2/sports/hockey/leagues?limit=100" | python3 -c "
          import sys,json; d=json.load(sys.stdin); print(d.get('count'), [i['\$ref'].split('leagues/')[1].split('?')[0] for i in d.get('items',[])])"
          for L in nhl mens-college-hockey womens-college-hockey ahl khl shl liiga del nl echl pwhl iihf.world olympics-mens-ice-hockey hockey-world-cup; do
            for D in 20261110 20261111; do
            printf "%s %s: " $L $D
            curl -s --compressed -m 25 -A "Matchday-Android/2.0" "https://site.api.espn.com/apis/site/v2/sports/hockey/$L/scoreboard?dates=$D" | python3 -c "
          import sys,json
          try:
              d=json.load(sys.stdin); ev=d.get('events',[]); lg=(d.get('leagues') or [{}])[0]
              print(lg.get('name'), len(ev), 'odds', sum(1 for e in ev if [o for o in (e['competitions'][0].get('odds') or []) if o]), [e['name'][:30] for e in ev[:2]])
          except Exception as e: print('ERR')"
            done
          done
          } > probe_out.txt 2>&1
          cat probe_out.txt
          git config user.name Matchday; git config user.email matchday@users.noreply.github.com
          git add probe_out.txt && git commit -qm "probe output" && git push -q origin HEAD:probe
