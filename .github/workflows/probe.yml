name: Probe data sources
on:
  push:
    branches: [ probe ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e
          cat > p.py <<'PY'
          import json,sys
          def strip(o):
              if isinstance(o,dict):
                  return {k:strip(v) for k,v in o.items() if k not in ('links','link','logos','tracking','images','headshot','flag','$ref','jerseyImages','notes','broadcasts','tickets','geoBroadcasts')}
              if isinstance(o,list): return [strip(x) for x in o[:2]]
              return o
          try: d=json.load(sys.stdin)
          except Exception as e: print('NOT JSON', e); sys.exit()
          for p in (sys.argv[1].split('.') if sys.argv[1] else []):
              d=d[int(p)] if p.isdigit() and isinstance(d,list) and len(d)>int(p) else (d.get(p) if isinstance(d,dict) else None)
              if d is None: print('MISSING',p); sys.exit()
          print(json.dumps(strip(d))[:int(sys.argv[2])])
          PY
          g() { curl -s --compressed -m 30 "$1"; }
          S=https://site.api.espn.com/apis/site/v2/sports/soccer
          {
          curl -s -m 25 "https://www.thesportsdb.com/api/v1/json/123/search_all_leagues.php?s=Ice%20Hockey" > /tmp/l.json
          python3 -c "
          import json; d=json.load(open('/tmp/l.json')); L=d.get('countries') or d.get('leagues') or []; print(len(L)); print([(l['idLeague'],l['strLeague'],l.get('strCountry')) for l in L])"
          for id in $(python3 -c "
          import json; d=json.load(open('/tmp/l.json')); L=d.get('countries') or []
          want=('KHL','Swedish','Finnish','German','Swiss','AHL','Czech','Austrian','Norwegian','Danish','Slovak','Champions','Allsvenskan','OHL','ECHL','PWHL')
          print(' '.join(l['idLeague'] for l in L if any(w in l['strLeague'] for w in want)))"); do
            printf "%s next: " $id
            curl -s -m 25 "https://www.thesportsdb.com/api/v1/json/123/eventsnextleague.php?id=$id" | python3 -c "
          import sys,json
          try:
              d=json.load(sys.stdin); ev=d.get('events') or []; print(len(ev), [(e['strEvent'][:28], e.get('strTimestamp')) for e in ev[:2]])
          except Exception as e: print('ERR')"
            sleep 1
          done
          printf "season KHL: "; curl -s -m 25 "https://www.thesportsdb.com/api/v1/json/123/eventsseason.php?id=4920&s=2026-2027" | python3 -c "
          import sys,json; d=json.load(sys.stdin); ev=d.get('events') or []; print(len(ev), ev[0]['dateEvent'] if ev else '', ev[-1]['dateEvent'] if ev else '', ev[-1].get('intHomeScore') if ev else '')"
          printf "past KHL: "; curl -s -m 25 "https://www.thesportsdb.com/api/v1/json/123/eventspastleague.php?id=4920" | python3 -c "
          import sys,json; d=json.load(sys.stdin); ev=d.get('events') or []; print(len(ev), [(e['strEvent'][:28],e['dateEvent'],e.get('intHomeScore'),e.get('intAwayScore')) for e in ev[:3]])"
          printf "table KHL: "; curl -s -m 25 "https://www.thesportsdb.com/api/v1/json/123/lookuptable.php?l=4920&s=2026-2027" | head -c 300; echo
          } > probe_out.txt 2>&1
          cat probe_out.txt
          git config user.name Matchday; git config user.email matchday@users.noreply.github.com
          git add probe_out.txt && git commit -qm "probe output" && git push -q origin HEAD:probe
