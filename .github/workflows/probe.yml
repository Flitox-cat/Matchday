name: Probe data sources
on:
  push:
    branches: [ probe ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e
          cat > p.py <<'PY'
          import json,sys
          def strip(o):
              if isinstance(o,dict):
                  return {k:strip(v) for k,v in o.items() if k not in ('links','link','logos','tracking','images','headshot','flag','$ref','jerseyImages','notes','broadcasts','tickets','geoBroadcasts')}
              if isinstance(o,list): return [strip(x) for x in o[:2]]
              return o
          try: d=json.load(sys.stdin)
          except Exception as e: print('NOT JSON', e); sys.exit()
          for p in (sys.argv[1].split('.') if sys.argv[1] else []):
              d=d[int(p)] if p.isdigit() and isinstance(d,list) and len(d)>int(p) else (d.get(p) if isinstance(d,dict) else None)
              if d is None: print('MISSING',p); sys.exit()
          print(json.dumps(strip(d))[:int(sys.argv[2])])
          PY
          g() { curl -s --compressed -m 30 "$1"; }
          S=https://site.api.espn.com/apis/site/v2/sports/soccer
          {
          for L in caf.nations_qual uefa.nations fifa.worldq.uefa uefa.euroq fifa.friendly fifa.worldq.caf; do
            for D in 20261115 20261116 20261117; do
            printf "%s %s: " $L $D
            curl -s --compressed -m 25 -A "Matchday-Android/2.0" "https://site.api.espn.com/apis/site/v2/sports/soccer/$L/scoreboard?dates=$D" > /tmp/b.json
            python3 -c "
          import json
          d=json.load(open('/tmp/b.json')); ev=d.get('events',[])
          wo=sum(1 for e in ev if [o for o in (e['competitions'][0].get('odds') or []) if o])
          pre=sum(1 for e in ev if e['status']['type']['state']=='pre')
          print(len(ev),'events',pre,'pre',wo,'odds', [e['name'][:30] for e in ev[:3]])
          ids=[e['id'] for e in ev if e['status']['type']['state']=='pre']
          open('/tmp/id','w').write(ids[0] if ids else '')"
            id=$(cat /tmp/id)
            if [ -n "$id" ] && [ "$D" = 20261115 ]; then
              curl -s --compressed -m 25 "https://site.api.espn.com/apis/site/v2/sports/soccer/$L/summary?event=$id" | python3 -c "
          import sys,json
          d=json.load(sys.stdin); lf=d.get('lastFiveGames') or []
          print('   summary keys', [k for k in d.keys()][:20]); print('   lastFive', [(x.get('team',{}).get('displayName'), len(x.get('events',[])), [ (e.get('gameResult'), e.get('score'), e.get('leagueName')) for e in x.get('events',[])][:5]) for x in lf])
          print('   h2h', len(d.get('headToHeadGames') or []), 'odds', len(d.get('odds') or []), 'pickcenter', len(d.get('pickcenter') or []))"
            fi
            done
          done
          } > probe_out.txt 2>&1
          cat probe_out.txt
          git config user.name Matchday; git config user.email matchday@users.noreply.github.com
          git add probe_out.txt && git commit -qm "probe output" && git push -q origin HEAD:probe
