name: Probe data sources
on:
  push:
    branches: [ probe ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe team endpoints
        run: |
          set +e
          cat > p.py <<'PY'
          import json,sys
          def strip(o):
              if isinstance(o,dict):
                  return {k:strip(v) for k,v in o.items() if k not in ('links','link','logos','tracking','images','headshot','flag','$ref','jerseyImages')}
              if isinstance(o,list): return [strip(x) for x in o[:3]]
              return o
          try:
              d=json.load(sys.stdin)
          except Exception as e:
              print('NOT JSON', e); sys.exit()
          for p in (sys.argv[1].split('.') if sys.argv[1] else []):
              d=d[int(p)] if p.isdigit() else d.get(p) if isinstance(d,dict) else None
              if d is None: print('MISSING',p); sys.exit()
          print(json.dumps(strip(d))[:int(sys.argv[2])])
          PY
          g() { curl -s --compressed -m 30 "$1"; }
          S=https://site.api.espn.com/apis/site/v2/sports/soccer
          echo "=== team via uefa.champions"; g "$S/uefa.champions/teams/887" | python3 p.py team 2500
          echo "=== team via all"; g "$S/all/teams/887" | python3 p.py team 1500
          echo "=== team defaultLeague via core"; g "https://sports.core.api.espn.com/v2/sports/soccer/leagues/uefa.champions/teams/887" | python3 p.py "" 1500
          echo "=== team schedule"; g "$S/uefa.champions/teams/887/schedule" | python3 p.py "" 1200
          echo "=== gre.1 standings"; g "https://site.api.espn.com/apis/v2/sports/soccer/gre.1/standings" | python3 p.py children.0.standings.entries.0 2000
          echo "=== tur.1 standings exists"; g "https://site.api.espn.com/apis/v2/sports/soccer/tur.1/standings" | python3 p.py children.0.name 200
          echo "=== cze.1"; g "https://site.api.espn.com/apis/v2/sports/soccer/cze.1/standings" | python3 p.py children.0.name 200
          echo "=== bel.1"; g "https://site.api.espn.com/apis/v2/sports/soccer/bel.1/standings" | python3 p.py children.0.name 200
          echo "=== eng.1 entry full stats"; g "https://site.api.espn.com/apis/v2/sports/soccer/eng.1/standings" | python3 -c "
          import json,sys;d=json.load(sys.stdin);e=d['children'][0]['standings']['entries'][0]
          print(e['team']['displayName'],[(s.get('name'),s.get('displayValue')) for s in e['stats']])"
          echo "=== summary h2h larger example (Arsenal v Liverpool style)"; SB=$(g "$S/eng.1/scoreboard?dates=20261108"); echo "$SB" | python3 -c "import sys,json;d=json.load(sys.stdin);print([(e['id'],e['name']) for e in d['events']][:5])"
          ID=$(echo "$SB" | python3 -c "import sys,json;print(json.load(sys.stdin)['events'][0]['id'])")
          g "$S/eng.1/summary?event=$ID" | python3 -c "
          import json,sys;d=json.load(sys.stdin)
          for s in d.get('seasonseries',[]): print(s.get('type'),s.get('title'),s.get('seriesLabel'),s.get('shortSummary'),len(s.get('events',[])),[ (e.get('date'),e.get('competitionName')) for e in s.get('events',[])][:10])
          print('h2hGames', json.dumps(d.get('headToHeadGames'))[:800])"
