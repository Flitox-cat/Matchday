name: Probe data sources
on:
  push:
    branches: [ probe ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e
          cat > p.py <<'PY'
          import json,sys
          def strip(o):
              if isinstance(o,dict):
                  return {k:strip(v) for k,v in o.items() if k not in ('links','link','logos','tracking','images','headshot','flag','$ref','jerseyImages','notes','broadcasts','tickets','geoBroadcasts')}
              if isinstance(o,list): return [strip(x) for x in o[:2]]
              return o
          try: d=json.load(sys.stdin)
          except Exception as e: print('NOT JSON', e); sys.exit()
          for p in (sys.argv[1].split('.') if sys.argv[1] else []):
              d=d[int(p)] if p.isdigit() and isinstance(d,list) and len(d)>int(p) else (d.get(p) if isinstance(d,dict) else None)
              if d is None: print('MISSING',p); sys.exit()
          print(json.dumps(strip(d))[:int(sys.argv[2])])
          PY
          g() { curl -s --compressed -m 30 "$1"; }
          S=https://site.api.espn.com/apis/site/v2/sports/soccer
          {
          for D in 20261103 20261027 20261020 20260915 20260601; do
            printf "== atp %s: " $D
            curl -s --compressed -m 25 -A "Matchday-Android/2.0" "https://site.api.espn.com/apis/site/v2/sports/tennis/atp/scoreboard?dates=$D" > /tmp/b.json
            python3 -c "
          import json
          d=json.load(open('/tmp/b.json')); ev=d.get('events',[])
          print(len(ev),'events', [e.get('name') for e in ev])
          for e in ev[:1]:
              print('event keys',list(e.keys())); print('venue',json.dumps(e.get('venue'))[:200], 'major', e.get('major'))
              n=0;post=0
              for g in e.get('groupings',[]):
                  for c in g.get('competitions',[]):
                      n+=1
                      if c.get('status',{}).get('type',{}).get('state')=='post': post+=1
              print('comps',n,'post',post, 'groupings',[g.get('grouping',{}).get('displayName') for g in e.get('groupings',[])])
              c=e['groupings'][0]['competitions'][-1]
              print('comp keys',list(c.keys()))
              print(json.dumps(c)[:1500])
          "
          done
          for y in 2025 2026; do printf "TML $y: "; curl -s -o /dev/null -w "%{http_code} %{size_download}\n" -m 30 "https://raw.githubusercontent.com/Tennismylife/TML-Database/master/$y.csv"; done
          } > probe_out.txt 2>&1
          cat probe_out.txt
          git config user.name Matchday; git config user.email matchday@users.noreply.github.com
          git add probe_out.txt && git commit -qm "probe output" && git push -q origin HEAD:probe
