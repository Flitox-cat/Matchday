name: Probe data sources
on:
  push:
    branches: [ probe ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e
          cat > p.py <<'PY'
          import json,sys
          def strip(o):
              if isinstance(o,dict):
                  return {k:strip(v) for k,v in o.items() if k not in ('links','link','logos','tracking','images','headshot','flag','$ref','jerseyImages','notes','broadcasts','tickets','geoBroadcasts')}
              if isinstance(o,list): return [strip(x) for x in o[:2]]
              return o
          try: d=json.load(sys.stdin)
          except Exception as e: print('NOT JSON', e); sys.exit()
          for p in (sys.argv[1].split('.') if sys.argv[1] else []):
              d=d[int(p)] if p.isdigit() and isinstance(d,list) and len(d)>int(p) else (d.get(p) if isinstance(d,dict) else None)
              if d is None: print('MISSING',p); sys.exit()
          print(json.dumps(strip(d))[:int(sys.argv[2])])
          PY
          g() { curl -s --compressed -m 30 "$1"; }
          S=https://site.api.espn.com/apis/site/v2/sports/soccer
          {
          for path in overview stats splits gamelog eventlog results bio; do
            printf "== %s: " $path
            curl -s --compressed -m 20 -A "Matchday-Android/2.0" "https://site.web.api.espn.com/apis/common/v3/sports/tennis/atp/athletes/3623/$path" | python3 -c "
          import sys,json
          try:
              d=json.load(sys.stdin); print(list(d.keys())[:12]); print(json.dumps(d)[:700])
          except Exception as e: print('ERR',e)"
          done
          printf "== core eventlog: "; curl -s --compressed -m 20 "https://sports.core.api.espn.com/v2/sports/tennis/leagues/atp/athletes/3623/eventlog" | head -c 500; echo
          printf "== core statistics: "; curl -s --compressed -m 20 "https://sports.core.api.espn.com/v2/sports/tennis/leagues/atp/athletes/3623/statistics" | head -c 500; echo
          printf "== core records: "; curl -s --compressed -m 20 "https://sports.core.api.espn.com/v2/sports/tennis/leagues/atp/athletes/3623/records" | head -c 500; echo
          } > probe_out.txt 2>&1
          cat probe_out.txt
          git config user.name Matchday; git config user.email matchday@users.noreply.github.com
          git add probe_out.txt && git commit -qm "probe output" && git push -q origin HEAD:probe
