name: Probe data sources
on:
  push:
    branches: [ probe ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e
          cat > p.py <<'PY'
          import json,sys
          def strip(o):
              if isinstance(o,dict):
                  return {k:strip(v) for k,v in o.items() if k not in ('links','link','logos','tracking','images','headshot','flag','$ref','jerseyImages','notes','broadcasts','tickets','geoBroadcasts')}
              if isinstance(o,list): return [strip(x) for x in o[:2]]
              return o
          try: d=json.load(sys.stdin)
          except Exception as e: print('NOT JSON', e); sys.exit()
          for p in (sys.argv[1].split('.') if sys.argv[1] else []):
              d=d[int(p)] if p.isdigit() and isinstance(d,list) and len(d)>int(p) else (d.get(p) if isinstance(d,dict) else None)
              if d is None: print('MISSING',p); sys.exit()
          print(json.dumps(strip(d))[:int(sys.argv[2])])
          PY
          g() { curl -s --compressed -m 30 "$1"; }
          S=https://site.api.espn.com/apis/site/v2/sports/soccer
          {
          for L in uefa.europa uefa.europa.conf; do
            curl -s --compressed -m 25 -A "Matchday-Android/2.0" "https://site.api.espn.com/apis/site/v2/sports/soccer/$L/scoreboard" > /tmp/b.json
            python3 -c "
          import json; d=json.load(open('/tmp/b.json'))
          ev=[e for e in d.get('events',[]) if e['status']['type']['state'] in ('in','post')]
          print('$L', len(d.get('events',[])), [(e['name'][:30], e['status']['type']['shortDetail']) for e in ev[:3]])
          open('/tmp/id','w').write(ev[0]['id'] if ev else '')"
            id=$(cat /tmp/id); [ -z "$id" ] && continue
            curl -s --compressed -m 25 "https://site.api.espn.com/apis/site/v2/sports/soccer/$L/summary?event=$id" | python3 -c "
          import sys,json
          d=json.load(sys.stdin); r=d.get('rosters') or []
          print('rosters', len(r))
          for t in r[:1]:
              pl=t.get('roster') or []
              print('players', len(pl))
              for p in pl[:3]:
                  print(p.get('athlete',{}).get('displayName'), p.get('starter'), p.get('position',{}).get('abbreviation'), [(s.get('name'), s.get('displayValue')) for s in (p.get('stats') or [])])
          ke=d.get('keyEvents') or d.get('commentary') or []
          print('keyEvents', len(d.get('keyEvents') or []), 'commentary', len(d.get('commentary') or []))
          for k in (d.get('keyEvents') or [])[:4]: print('  ', k.get('type',{}).get('text'), k.get('clock',{}).get('displayValue'), [x.get('athlete',{}).get('displayName') for x in (k.get('participants') or [])], (k.get('text') or '')[:80])
          for k in (d.get('commentary') or [])[:4]: print('  C', (k.get('text') or '')[:100])
          "
            break
          done
          } > probe_out.txt 2>&1
          cat probe_out.txt
          git config user.name Matchday; git config user.email matchday@users.noreply.github.com
          git add probe_out.txt && git commit -qm "probe output" && git push -q origin HEAD:probe
