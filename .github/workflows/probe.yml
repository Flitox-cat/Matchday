name: Probe data sources
on:
  push:
    branches: [ probe ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e
          cat > p.py <<'PY'
          import json,sys
          def strip(o):
              if isinstance(o,dict):
                  return {k:strip(v) for k,v in o.items() if k not in ('links','link','logos','tracking','images','headshot','flag','$ref','jerseyImages','notes','broadcasts','tickets','geoBroadcasts')}
              if isinstance(o,list): return [strip(x) for x in o[:2]]
              return o
          try: d=json.load(sys.stdin)
          except Exception as e: print('NOT JSON', e); sys.exit()
          for p in (sys.argv[1].split('.') if sys.argv[1] else []):
              d=d[int(p)] if p.isdigit() and isinstance(d,list) and len(d)>int(p) else (d.get(p) if isinstance(d,dict) else None)
              if d is None: print('MISSING',p); sys.exit()
          print(json.dumps(strip(d))[:int(sys.argv[2])])
          PY
          g() { curl -s --compressed -m 30 "$1"; }
          S=https://site.api.espn.com/apis/site/v2/sports/soccer
          {
          for D in "" 20261110 20261111 20261112 20261113 20261114 20261115 20261116 20261117 20261118; do
            printf "%s: " "$D"
            curl -s --compressed -m 25 -A "Matchday-Android/2.0" "https://site.api.espn.com/apis/site/v2/sports/soccer/caf.nations_qual/scoreboard${D:+?dates=$D}" | python3 -c "
          import sys,json
          d=json.load(sys.stdin); ev=d.get('events',[]); print(len(ev), d.get('leagues',[{}])[0].get('season',{}).get('year'), [e['name'][:35]+' '+e['date'][:16]+' odds='+str(bool([o for o in (e['competitions'][0].get('odds') or []) if o])) for e in ev[:5]])"
          done
          curl -s --compressed -m 25 "https://site.api.espn.com/apis/v2/sports/soccer/caf.nations_qual/standings" | python3 -c "
          import sys,json
          d=json.load(sys.stdin); c=d['children'][0]['standings']; print(c.get('season'), c.get('seasonDisplayName'), [ (e['team']['displayName'], [s['displayValue'] for s in e['stats'] if s['name'] in ('gamesPlayed','points')]) for e in c['entries']])"
          } > probe_out.txt 2>&1
          cat probe_out.txt
          git config user.name Matchday; git config user.email matchday@users.noreply.github.com
          git add probe_out.txt && git commit -qm "probe output" && git push -q origin HEAD:probe
