name: Probe data sources
on:
  push:
    branches: [ probe ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e
          cat > p.py <<'PY'
          import json,sys
          def strip(o):
              if isinstance(o,dict):
                  return {k:strip(v) for k,v in o.items() if k not in ('links','link','logos','tracking','images','headshot','flag','$ref','jerseyImages','notes','broadcasts','tickets','geoBroadcasts')}
              if isinstance(o,list): return [strip(x) for x in o[:2]]
              return o
          try: d=json.load(sys.stdin)
          except Exception as e: print('NOT JSON', e); sys.exit()
          for p in (sys.argv[1].split('.') if sys.argv[1] else []):
              d=d[int(p)] if p.isdigit() and isinstance(d,list) and len(d)>int(p) else (d.get(p) if isinstance(d,dict) else None)
              if d is None: print('MISSING',p); sys.exit()
          print(json.dumps(strip(d))[:int(sys.argv[2])])
          PY
          g() { curl -s --compressed -m 30 "$1"; }
          S=https://site.api.espn.com/apis/site/v2/sports/soccer
          {
          curl -s --compressed -m 25 -A "Matchday-Android/2.0" "https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.europa/scoreboard" > /tmp/b.json
          id=$(python3 -c "
          import json; d=json.load(open('/tmp/b.json')); print([e['id'] for e in d['events'] if e['status']['type']['state']=='post'][0])")
          curl -s --compressed -m 25 "https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.europa/summary?event=$id" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for t in d['rosters']:
              print('TEAM', t.get('team',{}).get('displayName'), t.get('homeAway'), list(t.keys()))
              for p in t['roster']:
                  st={s['name']:s['displayValue'] for s in p.get('stats') or []}
                  print('  ', p.get('athlete',{}).get('displayName'), 'starter',p.get('starter'), 'in',p.get('subbedIn'), 'out',p.get('subbedOut'), p.get('position',{}).get('abbreviation'), p.get('formationPlace'), 'fc',st.get('foulsCommitted'),'fs',st.get('foulsSuffered'),'sh',st.get('totalShots'),'sot',st.get('shotsOnTarget'),'g',st.get('totalGoals'), 'yc', st.get('yellowCards'), [k for k in p.keys() if k not in ('athlete','stats','position')])
          "
          } > probe_out.txt 2>&1
          cat probe_out.txt
          git config user.name Matchday; git config user.email matchday@users.noreply.github.com
          git add probe_out.txt && git commit -qm "probe output" && git push -q origin HEAD:probe
