name: Probe data sources
on:
  push:
    branches: [ probe ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e
          cat > p.py <<'PY'
          import json,sys
          def strip(o):
              if isinstance(o,dict):
                  return {k:strip(v) for k,v in o.items() if k not in ('links','link','logos','tracking','images','headshot','flag','$ref','jerseyImages','notes','broadcasts','tickets','geoBroadcasts')}
              if isinstance(o,list): return [strip(x) for x in o[:2]]
              return o
          try: d=json.load(sys.stdin)
          except Exception as e: print('NOT JSON', e); sys.exit()
          for p in (sys.argv[1].split('.') if sys.argv[1] else []):
              d=d[int(p)] if p.isdigit() and isinstance(d,list) and len(d)>int(p) else (d.get(p) if isinstance(d,dict) else None)
              if d is None: print('MISSING',p); sys.exit()
          print(json.dumps(strip(d))[:int(sys.argv[2])])
          PY
          g() { curl -s --compressed -m 30 "$1"; }
          S=https://site.api.espn.com/apis/site/v2/sports/soccer
          {
          for L in esp.copa_del_rey esp.super_cup esp.2 eng.fa eng.league_cup eng.3 eng.4 eng.5 ita.coppa_italia ita.super_cup ita.2 ger.dfb_pokal ger.2 ger.super_cup fra.coupe_de_france fra.2 fra.super_cup por.taca.portugal por.2 ned.knvb_beker ned.2 sco.1 sco.tennents sco.cis bel.1 tur.1 tur.cup gre.1 aut.1 sui.1 den.1 nor.1 swe.1 rus.1 ukr.1 pol.1 cze.1 cyp.1 isr.1 rou.1 srb.1 cro.1 irl.1 bra.1 bra.2 bra.copa_do_brazil arg.1 arg.copa mex.1 col.1 chi.1 uru.1 per.1 ecu.1 par.1 ven.1 bol.1 jpn.1 kor.1 chn.1 aus.1 ind.1 tha.1 uae.1 qat.1 ksa.kings.cup egy.1 mar.1 rsa.1 nga.1 usa.open concacaf.champions concacaf.gold concacaf.nations.league conmebol.libertadores conmebol.sudamericana conmebol.america afc.champions afc.asian.cup caf.champions caf.nations uefa.nations uefa.euro uefa.super_cup uefa.euroq fifa.worldq.uefa fifa.worldq.conmebol fifa.worldq.afc fifa.worldq.caf fifa.worldq.concacaf fifa.friendly fifa.cwc fifa.intercontinental_cup club.friendly; do
            g "$S/$L/scoreboard" | python3 -c "
          import sys,json
          try:
              d=json.load(sys.stdin); lg=d.get('leagues') or [{}]
              print('$L', 'OK', repr(lg[0].get('name')), len(d.get('events',[])))
          except Exception as e:
              print('$L', 'FAIL')"
          done
          for L in basketball/wnba basketball/mens-college-basketball basketball/womens-college-basketball hockey/mens-college-hockey; do
            g "https://site.api.espn.com/apis/site/v2/sports/$L/scoreboard" | python3 -c "
          import sys,json
          try:
              d=json.load(sys.stdin); lg=d.get('leagues') or [{}]; print('$L','OK',repr(lg[0].get('name')),len(d.get('events',[])))
          except Exception: print('$L','FAIL')"
          done
          } > probe_out.txt 2>&1
          cat probe_out.txt
          git config user.name Matchday; git config user.email matchday@users.noreply.github.com
          git add probe_out.txt && git commit -qm "probe output" && git push -q origin HEAD:probe
