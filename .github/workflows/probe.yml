name: Probe data sources
on:
  push:
    branches: [ probe ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e
          cat > p.py <<'PY'
          import json,sys
          def strip(o):
              if isinstance(o,dict):
                  return {k:strip(v) for k,v in o.items() if k not in ('links','link','logos','tracking','images','headshot','flag','$ref','jerseyImages','notes','broadcasts','tickets','geoBroadcasts')}
              if isinstance(o,list): return [strip(x) for x in o[:2]]
              return o
          try: d=json.load(sys.stdin)
          except Exception as e: print('NOT JSON', e); sys.exit()
          for p in (sys.argv[1].split('.') if sys.argv[1] else []):
              d=d[int(p)] if p.isdigit() and isinstance(d,list) and len(d)>int(p) else (d.get(p) if isinstance(d,dict) else None)
              if d is None: print('MISSING',p); sys.exit()
          print(json.dumps(strip(d))[:int(sys.argv[2])])
          PY
          g() { curl -s --compressed -m 30 "$1"; }
          S=https://site.api.espn.com/apis/site/v2/sports/soccer
          {
          for L in soccer/esp.copa_del_rey soccer/ita.coppa_italia soccer/eng.league_cup basketball/nba hockey/nhl; do
            for D in 20261109 20261110 20261111 20261112; do
              printf "%s %s -> " "$L" "$D"
              curl -s --compressed -m 25 -A "Matchday-Android/2.0" "https://site.api.espn.com/apis/site/v2/sports/$L/scoreboard?dates=$D" | python3 -c "
          import sys,json
          d=json.load(sys.stdin); ev=d.get('events',[])
          wo=sum(1 for e in ev if any(o for o in (e['competitions'][0].get('odds') or []) if o))
          print(len(ev),'events,',wo,'with odds;', [e['name'][:40]+' '+e['date'] for e in ev[:4]])"
            done
          done
          for T in atp wta; do
            curl -s --compressed -m 25 -A "Matchday-Android/2.0" "https://site.api.espn.com/apis/site/v2/sports/tennis/$T/scoreboard" | python3 -c "
          import sys,json
          d=json.load(sys.stdin); n=0; wo=0; dates=set()
          for e in d.get('events',[]):
              for g in e.get('groupings',[]):
                  for c in g.get('competitions',[]):
                      if c.get('status',{}).get('type',{}).get('state')=='pre':
                          n+=1; dates.add(c.get('date','')[:10])
                          if any(o for o in (c.get('odds') or []) if o): wo+=1
          print('$T pre matches',n,'with odds',wo,sorted(dates))"
          done
          } > probe_out.txt 2>&1
          cat probe_out.txt
          git config user.name Matchday; git config user.email matchday@users.noreply.github.com
          git add probe_out.txt && git commit -qm "probe output" && git push -q origin HEAD:probe
