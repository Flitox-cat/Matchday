name: Probe data sources
on:
  push:
    branches: [ probe ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e
          cat > p.py <<'PY'
          import json,sys
          def strip(o):
              if isinstance(o,dict):
                  return {k:strip(v) for k,v in o.items() if k not in ('links','link','logos','tracking','images','headshot','flag','$ref','jerseyImages','notes','broadcasts','tickets','geoBroadcasts')}
              if isinstance(o,list): return [strip(x) for x in o[:2]]
              return o
          try: d=json.load(sys.stdin)
          except Exception as e: print('NOT JSON', e); sys.exit()
          for p in (sys.argv[1].split('.') if sys.argv[1] else []):
              d=d[int(p)] if p.isdigit() and isinstance(d,list) and len(d)>int(p) else (d.get(p) if isinstance(d,dict) else None)
              if d is None: print('MISSING',p); sys.exit()
          print(json.dumps(strip(d))[:int(sys.argv[2])])
          PY
          g() { curl -s --compressed -m 30 "$1"; }
          S=https://site.api.espn.com/apis/site/v2/sports/soccer
          {
          for r in tennis_atp tennis_wta tennis_MatchChartingProject tennis_slam_pointbypoint; do
            echo "== $r"; curl -s -m 20 "https://api.github.com/repos/JeffSackmann/$r" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('pushed_at'),(d.get('license') or {}).get('spdx_id'))"
            curl -s -m 20 "https://api.github.com/repos/JeffSackmann/$r/contents" | python3 -c "import sys,json;print([x['name'] for x in json.load(sys.stdin) if any(k in x['name'] for k in ('2024','2025','2026','current'))])"
          done
          for f in tennis_atp/master/atp_matches_2026.csv tennis_atp/master/atp_matches_2025.csv tennis_atp/master/atp_rankings_current.csv tennis_wta/master/wta_matches_2026.csv; do
            printf "%s: " $f; curl -s -m 20 "https://raw.githubusercontent.com/JeffSackmann/$f" | (head -c 300000 > /tmp/x; wc -l < /tmp/x; tail -1 /tmp/x | cut -c1-200)
          done
          head -1 /tmp/x | cut -c1-600
          for y in 2026 2025; do printf "tennis-data $y: "; curl -s -o /dev/null -w "%{http_code} %{size_download}\n" -m 20 "http://www.tennis-data.co.uk/$y/$y.xlsx"; done
          curl -s -m 20 http://www.tennis-data.co.uk/alldata.php | grep -o 'href="[^"]*202[56][^"]*"' | head
          printf "robots tennis-data: "; curl -s -m 15 http://www.tennis-data.co.uk/robots.txt | head -5
          printf "\nespn athlete: "; curl -s -m 20 "https://site.web.api.espn.com/apis/common/v3/sports/tennis/atp/athletes/3623" | head -c 400
          } > probe_out.txt 2>&1
          cat probe_out.txt
          git config user.name Matchday; git config user.email matchday@users.noreply.github.com
          git add probe_out.txt && git commit -qm "probe output" && git push -q origin HEAD:probe
