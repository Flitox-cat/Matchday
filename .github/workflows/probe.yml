name: Probe data sources
on:
  push:
    branches: [ probe ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e
          cat > p.py <<'PY'
          import json,sys
          def strip(o):
              if isinstance(o,dict):
                  return {k:strip(v) for k,v in o.items() if k not in ('links','link','logos','tracking','images','headshot','flag','$ref','jerseyImages','notes','broadcasts','tickets','geoBroadcasts')}
              if isinstance(o,list): return [strip(x) for x in o[:2]]
              return o
          try: d=json.load(sys.stdin)
          except Exception as e: print('NOT JSON', e); sys.exit()
          for p in (sys.argv[1].split('.') if sys.argv[1] else []):
              d=d[int(p)] if p.isdigit() and isinstance(d,list) and len(d)>int(p) else (d.get(p) if isinstance(d,dict) else None)
              if d is None: print('MISSING',p); sys.exit()
          print(json.dumps(strip(d))[:int(sys.argv[2])])
          PY
          g() { curl -s --compressed -m 30 "$1"; }
          S=https://site.api.espn.com/apis/site/v2/sports/soccer
          {
          curl -s --compressed -m 25 -A "Matchday-Android/2.0" "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard?dates=20261122" > /tmp/b.json
          id=$(python3 -c "
          import json; d=json.load(open('/tmp/b.json')); print(d['events'][0]['id'])")
          curl -s --compressed -m 25 "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/summary?event=$id" > /tmp/s.json
          python3 -c "
          import json; d=json.load(open('/tmp/s.json'))
          lf=d.get('lastFiveGames') or []
          print('lastFive event keys', list((lf[0]['events'][0]).keys()) if lf and lf[0].get('events') else None)
          if lf: print([ (e.get('id'), e.get('leagueAbbreviation'), e.get('league'), e.get('gameDate')) for e in lf[0]['events'][:5]])
          r=d['rosters'][0]['roster'][3]; print('athlete', r['athlete'].get('id'), r['athlete'].get('displayName'))
          open('/tmp/ath','w').write(r['athlete']['id']); open('/tmp/ev','w').write(lf[0]['events'][1]['id'] if lf else '')"
          ath=$(cat /tmp/ath); ev=$(cat /tmp/ev)
          for U in "https://site.web.api.espn.com/apis/common/v3/sports/soccer/eng.1/athletes/$ath/gamelog" "https://site.web.api.espn.com/apis/common/v3/sports/soccer/athletes/$ath/gamelog" "https://site.web.api.espn.com/apis/common/v3/sports/soccer/eng.1/athletes/$ath/overview" "https://site.api.espn.com/apis/site/v2/sports/soccer/all/summary?event=$ev" "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/summary?event=$ev"; do
            printf "== %s\n" "$U"
            curl -s --compressed -m 25 -A "Matchday-Android/2.0" "$U" | python3 -c "
          import sys,json
          try:
              d=json.load(sys.stdin); print(list(d.keys())[:15]); s=json.dumps(d); i=s.find('oul'); print(s[max(0,i-300):i+300] if i>=0 else s[:300])
          except Exception as e: print('ERR',e)"
          done
          } > probe_out.txt 2>&1
          cat probe_out.txt
          git config user.name Matchday; git config user.email matchday@users.noreply.github.com
          git add probe_out.txt && git commit -qm "probe output" && git push -q origin HEAD:probe
